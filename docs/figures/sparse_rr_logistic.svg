   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="51.84" y="38.88" transform="rotate(-0 51.84 38.88)">Sparse reduced-rank logistic baseline</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4e6275" x="51.84" y="68.04" transform="rotate(-0 51.84 68.04)">Shared response factors from physiology-derived perturbation features; no learned perturbation-ID embeddings.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #4e6275" x="1094.4" y="32.4" transform="rotate(-0 1094.4 32.4)">IMPLEMENTED IN THIS CHANGE</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2358a5" x="72.576" y="171.341813" transform="rotate(-0 72.576 171.341813)">Frozen features X</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 199.630125)">Upstream physiology operator</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 216.258844)">Perturbation + graph context</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 232.887562)">Named node/state channels</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="360.576" y="171.341813" transform="rotate(-0 360.576 171.341813)">Normalization Z</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(360.576 199.630125)">Means/scales from training</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(360.576 216.258844)">rows with included evidence</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(360.576 232.887562)">Dense or CSR matrix</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="642.816" y="171.341813" transform="rotate(-0 642.816 171.341813)">Shared coefficients B</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(642.816 199.630125)">logits = Z B + intercepts</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(642.816 216.258844)">One column per symptom</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(642.816 232.887562)">Sparse rows, reduced rank</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="925.056" y="171.341813" transform="rotate(-0 925.056 171.341813)">Sigmoid</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(925.056 199.630125)">Per-symptom</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(925.056 216.258844)">probabilities</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(925.056 232.887562)">for new perturbations</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2358a5" x="72.576" y="378.701813" transform="rotate(-0 72.576 378.701813)">Evidence Y, M, w</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 406.990125)">Binary symptom targets Y</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 423.618844)">Explicit inclusion mask M</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 440.247563)">Nonnegative weights w</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 456.876281)">Predefined leakage groups</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a76615" x="360.576" y="378.701813" transform="rotate(-0 360.576 378.701813)">Fitting objective</text>
   </g>
   <g id="text_15">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(360.576 407.749969)">Masked binary log loss</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(360.576 425.764414)">+ row-group penalty</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(360.576 443.778859)">+ nuclear-norm penalty</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(360.576 461.793305)">+ optional ridge penalty</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="786.816" y="378.701813" transform="rotate(-0 786.816 378.701813)">Factor interpretation</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(786.816 406.610203)">Post-fit SVD: B = U diag(s) V^T</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(786.816 422.546059)">U: feature-factor loadings</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(786.816 438.481914)">V: symptom-factor loadings</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(786.816 454.41777)">No unique biological mechanism implied</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #a76615" transform="translate(468.29625 296.602188)">proximal gradient</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #a76615" transform="translate(462.347812 307.8)">+ joint Dykstra prox</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #4e6275" transform="translate(51.84 593.691563)">Solid arrows: prediction/data flow. Dashed arrows: fitting feedback.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #4e6275" transform="translate(51.84 609.864375)">Missing targets are not automatic negatives; test labels do not select the model.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #768899" x="1128.96" y="631.8" transform="rotate(-0 1128.96 631.8)">auto-psych-nosology | architecture documentation</text>
   </g>
  </g>
