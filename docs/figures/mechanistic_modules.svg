   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="51.84" y="38.88" transform="rotate(-0 51.84 38.88)">Mechanistic pathway module architecture</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4e6275" x="51.84" y="68.04" transform="rotate(-0 51.84 68.04)">Implemented in mechanistic-pathway-learning; the graph adapter does not port this model into the nosology trainer.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #4e6275" x="1094.4" y="32.4" transform="rotate(-0 1094.4 32.4)">UPSTREAM MODEL / COMPARATIVE CANDIDATE</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2358a5" x="72.576" y="151.901813" transform="rotate(-0 72.576 151.901813)">Physiology graph + context</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253e52" x="72.576" y="179.810203" transform="rotate(-0 72.576 179.810203)">Relations, signs, compartments and context</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2358a5" x="475.776" y="151.901813" transform="rotate(-0 475.776 151.901813)">Localized perturbation</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253e52" x="475.776" y="180.190125" transform="rotate(-0 475.776 180.190125)">Target nodes, direction and magnitude</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="72.576" y="287.981813" transform="rotate(-0 72.576 287.981813)">Physiology encoder</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 316.270125)">Relational message passing</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 332.898844)">or signed linear response</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 349.527562)">Upstream biological operators</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="441.216" y="287.981813" transform="rotate(-0 441.216 287.981813)">Node-state field</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(441.216 316.270125)">Perturbation response by node</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(441.216 332.898844)">Keep location and state channels</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(441.216 349.527562)">Absolute or difference reading</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="798.336" y="287.981813" transform="rotate(-0 798.336 287.981813)">Sparse module pooling</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(798.336 316.270125)">Learn support over graph nodes</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(798.336 332.898844)">Supports may overlap</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(798.336 349.527562)">Weighted sum or mean</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="798.336" y="456.461813" transform="rotate(-0 798.336 456.461813)">Module activations</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(798.336 484.750125)">Readout + sigmoid per module</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(798.336 501.378844)">One activation profile</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(798.336 518.007563)">for each perturbation</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="441.216" y="456.461813" transform="rotate(-0 441.216 456.461813)">Noisy-OR head</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(441.216 484.750125)">Module-symptom links</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(441.216 501.378844)">+ symptom-specific leak</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(441.216 518.007563)">Combine multiple contributions</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137761" x="72.576" y="456.461813" transform="rotate(-0 72.576 456.461813)">Symptom probabilities</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 484.750125)">Evidence-based fitting</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 501.378844)">Support/link penalties</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253e52" transform="translate(72.576 518.007563)">Separate held-out evaluation</text>
   </g>
   <g id="text_20">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #4e6275" transform="translate(51.84 593.691563)">Several modules can contribute to one symptom; one module can contribute to several symptoms.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #4e6275" transform="translate(51.84 609.864375)">Learned supports and predictions require validation before being interpreted as causal pathways.</text>
   </g>
